name: ProofClose CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and pinned audit tool
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]" pip-audit==2.9.0
      - name: Backend tests
        run: python -m pytest backend/tests -q
      - name: Dependency audit
        run: python -m pip_audit --strict
      - name: Secret scan
        run: python scripts/scan_secrets.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test -- --run
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend production build
        working-directory: frontend
        run: npm run build
      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Deterministic evaluation
        run: python -m evals.runner
